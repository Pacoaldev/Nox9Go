name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  # Must match the bun that wrote web/bun.lock (lockfileVersion 2). A different
  # major rewrites the lockfile and --frozen-lockfile then fails.
  BUN_VERSION: "1.4.4"

jobs:
  # Detects which areas changed so docs-only commits skip heavy builds while
  # keeping go:embed satisfied when only Go files change.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "web/ internal/")
          fi

          if echo "$CHANGED" | grep -qE '^(web/|internal/|\.github/workflows/ci\.yml)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE '^(web/|internal/|cmd/|go\.mod|go\.sum|VERSION|\.github/workflows/ci\.yml)'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  # The frontend is embedded in the Go binary at compile time, so everything
  # else depends on a real bundle existing. Built once here and shared.
  web:
    name: Frontend (build, check, lint)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: web-bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            web-bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
            web-bun-${{ runner.os }}-

      # --frozen-lockfile: the lockfile is the source of truth. A mismatched
      # package.json fails here instead of silently resolving a different tree.
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # The ratchet is the gate, not a bare svelte-check: the tree carries a
      # pinned number of pre-existing type errors, and the script fails on a
      # new unresolved identifier or when that count grows.
      - name: svelte-check ratchet
        working-directory: web
        run: bun run ratchet:svelte

      - name: Lint
        working-directory: web
        run: bun run lint

      - name: Build SPA
        working-directory: web
        run: bun run build

      - name: Upload built SPA
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  backend:
    name: Backend (vet, test, build)
    needs: [changes, web]
    if: |
      always() && !cancelled() &&
      needs.changes.outputs.go == 'true' &&
      (needs.web.result == 'success' || needs.web.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # web/dist is gitignored (`//go:embed dist/*` needs it), so restore the
      # SPA artifact when built or create a placeholder when web was skipped.
      - name: Restore built SPA
        if: needs.web.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Stub SPA when Frontend skipped
        if: needs.web.result == 'skipped'
        run: |
          mkdir -p web/dist
          echo '<!doctype html><html><body>stub</body></html>' > web/dist/index.html

      - name: go vet
        run: go vet ./...

      # Coverage feeds Codecov: the badge and PR comments read from it.
      # -covermode=atomic keeps the profile valid for concurrent packages.
      - name: go test with coverage
        run: go test -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out

      # A clean build proves the binary really is self-contained: no build tag
      # or generated file that only exists in a developer's tree.
      - name: Build from clean tree
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/nox9go ./cmd/nox9go/

  race:
    name: Race detector (shard ${{ matrix.shard }}/3)
    needs: [changes, web]
    if: |
      always() && !cancelled() &&
      needs.changes.outputs.go == 'true' &&
      (needs.web.result == 'success' || needs.web.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # web/dist is gitignored (`//go:embed dist/*` needs it), so a clean clone
      # cannot compile until the artifact from the Frontend job is in place.
      - name: Restore built SPA
        if: needs.web.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Stub SPA when Frontend skipped
        if: needs.web.result == 'skipped'
        run: |
          mkdir -p web/dist
          echo '<!doctype html><html><body>stub</body></html>' > web/dist/index.html

      - name: go test -race (sharded)
        shell: pwsh
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 3
        run: |
          $idx = [int]$env:SHARD_INDEX
          $cnt = [int]$env:SHARD_COUNT
          # The matrix is 1-based so the job name reads correctly; the modulo
          # needs a 0-based index, so shift it here instead of in the expression
          # (Actions has no infix arithmetic operator).
          $slot = $idx - 1

          $testPkgs = @(
            go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... |
              Where-Object { $_ } |
              Sort-Object -Unique
          )

          $shardPkgs = @()
          for ($i = 0; $i -lt $testPkgs.Count; $i++) {
            if (($i % $cnt) -eq $slot) {
              $shardPkgs += $testPkgs[$i]
            }
          }

          "Shard $idx/$cnt -> $($shardPkgs.Count) paquetes de $($testPkgs.Count) con tests"
          if ($shardPkgs.Count -eq 0) {
            exit 0
          }

          go test -race -shuffle=on @shardPkgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: a secret removed from HEAD is still leaked

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerabilities:
    name: Vulnerability scan
    needs: [changes, web]
    if: |
      always() && !cancelled() &&
      needs.changes.outputs.go == 'true' &&
      (needs.web.result == 'success' || needs.web.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Restore built SPA
        if: needs.web.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Stub SPA when Frontend skipped
        if: needs.web.result == 'skipped'
        run: |
          mkdir -p web/dist
          echo '<!doctype html><html><body>stub</body></html>' > web/dist/index.html

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release-assets:
    name: Update manifest matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # version.json is what the updater trusts. If VERSION and the manifest
      # disagree, or a platform lost its URL or digest, an install would be
      # offered the wrong binary — the exact failure this job guards.
      - name: Validate version.json
        run: bun scripts/gen-version-manifest.mjs --check

  # The dashboard end-to-end suite is green since the six stale tests were
  # repaired (Language menu entries, chart tooltip selector), so it gates.
  e2e:
    name: End-to-end
    needs: [changes, web, backend]
    if: |
      always() && !cancelled() &&
      needs.changes.outputs.web == 'true' &&
      needs.web.result == 'success' &&
      needs.backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Restore built SPA
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Cache Bun install cache and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            e2e-${{ runner.os }}-${{ env.BUN_VERSION }}-
            e2e-${{ runner.os }}-

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # The harness spawns the real gateway at <repo>/nox9go and fails every
      # test with "gateway binary not found" when it is missing. The artifact
      # above is only the SPA; the binary has to be built here.
      - name: Build gateway binary
        run: CGO_ENABLED=0 go build -trimpath -o nox9go ./cmd/nox9go/

      # Keep --with-deps so system libs are present on fresh runners while
      # reusing cached browser binaries when the cache hits.
      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: web
        run: bun run e2e